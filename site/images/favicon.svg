<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
    <style>
        rect {
            fill: white;
            stroke: black;
            stroke-width: 16px;
        }
        @media (prefers-color-scheme: dark) {
            rect {
                fill: black;
                stroke: white
            }
        }
        text {
            fill: black;
        }
        @media (prefers-color-scheme: dark) {
