                fill: white;
            }
        }
    </style>
    <g>
        <rect width="480" height="480" rx="50" ry="50" x="16" y="16" />
        <text font-size="300" x="50%" y="50%" text-anchor="middle" dominant-baseline="middle">jdd</text>
    </g>
</svg>